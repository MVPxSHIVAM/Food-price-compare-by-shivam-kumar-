<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food Price Comparison</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        padding: 40px;
        color: #333;
    }
    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    h1 {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
    }
    input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #aaa;
        margin-top: 10px;
    }
    .btn {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ff6f61;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn:hover {
        background: #e8564d;
    }
    .result {
        margin-top: 25px;
        background: #fff5f5;    
        padding: 20px;
        border-radius: 15px;
        border-left: 5px solid #ff6f61;
        display: none;
    }
    .platform-list {
        margin-top: 20px;
    }
    .platform-card {
        background: #f7f7f7;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>🍽 Buy.Hatke</h1>
    <p>Find the best deals across online food platforms.</p>

    <input type="text" id="foodInput" placeholder="Enter food item..." />
    <button class="btn" onclick="comparePrices()">Compare Prices</button>

    <div id="result" class="result"></div>
</div>

<script>
function comparePrices() {
    var item = document.getElementById('foodInput').value;
    if (!item) {
        alert('Please enter a food item');
        return;
    }

    var prices = {
        Zomato: { price: 250, link: 'https://www.zomato.com' },
        Swiggy: { price: 230, link: 'https://www.swiggy.com' },
        UberEats: { price: 240, link: 'https://www.ubereats.com' }
    };

    var bestPlatform = null;
    var bestPrice = Infinity;

    for (var platform in prices) {
        if (prices[platform].price < bestPrice) {
            bestPrice = prices[platform].price;
            bestPlatform = platform;
        }
    }

    var resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';

    var html = `<h2>Best Deal for: ${item}</h2>
                <p><strong>🔥 ${bestPlatform}</strong> offers the best price at <strong>₹${bestPrice}</strong></p>
                <a href="${prices[bestPlatform].link}" target="_blank">Click here to order on ${bestPlatform}</a>
                <div class='platform-list'><h3>All Prices:</h3>`;

    for (var platform in prices) {
        html += `<div class='platform-card'><span>${platform}</span><span>₹${prices[platform].price}</span></div>`;
    }

    html += `</div>`;

    resultDiv.innerHTML = html;
}
</script>

<!-- Fancy Credits Section -->
<div style="
    margin-top: 40px;
    background: #ffe3e3;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    font-family: 'Poppins', sans-serif;
">
    <h3 style="margin-bottom: 10px; font-weight: 600;">⭐A heartfull presentation⭐</h3>
    <p style="margin-top: 15px; font-size: 14px; color: #555;">Made with ❤️ for Food Lovers</p>
</div>


</body>
</html>
